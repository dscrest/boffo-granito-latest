    <!-- Fonts: Zoho Puvi only, self-hosted from public/fonts via @font-face in
         styles.css. The Google Fonts link (Inter + IBM Plex Mono) was removed
         2026-07-09 — nothing references those families any more, and dropping
         it removes a render-blocking third-party request. -->
    <!-- Catalyst Web SDK (Embedded Auth). init.js is injected by Catalyst hosting and
         only resolves on the deployed domain; under `vite dev` it 404s and the app
         falls back to the dev auth stub. Verify the exact 4.x patch on first deploy. -->
    <script src="https://static.zohocdn.com/catalyst/sdk/js/4.4.0/catalystWebSDK.js"></script>
    <script src="/__catalyst/sdk/init.js"></script>
  </head>
